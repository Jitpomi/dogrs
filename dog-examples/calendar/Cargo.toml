[package]
publish = false
name = "calendar"
version = "0.1.0"
edition = "2021"
description = "Real-time collaborative calendar example demonstrating DogRS core, WebSockets, and dog-queue"


[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros", "json", "ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
dog-transport = { path = "../../dog-transport", features = ["http"] }
dog-core = { path = "../../dog-core", features = ["json", "adapters"] }
dog-queue = { path = "../../dog-queue" }
dog-schema = { path = "../../dog-schema" }
dog-schema-validator = { path = "../../dog-schema-validator" }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["fs", "cors"] }
http = "1"
http-body-util = "0.1.3"
bytes = "1"
futures = "0.3.32"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
dotenvy = "0.15.7"

[dev-dependencies]
anyhow = "1.0.102"
tower = "0.5.3"
http-body-util = "0.1.3"
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }
