[package]
name = "auth-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
dog-core = { path = "../../dog-core", features = ["json", "adapters"] }
dog-transport = { path = "../../dog-transport", features = ["http"] }
dog-auth = { path = "../../dog-auth" }
dog-auth-local = { path = "../../dog-auth-local" }
dog-auth-oauth = { path = "../../dog-auth-oauth", features = ["oauth2-client"] }
dog-schema = { path = "../../dog-schema" }
dog-schema-validator = { path = "../../dog-schema-validator" }
actix-web = "4"
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
http = "1"
http-body-util = "0.1"
tower = "0.5.3"
anyhow = "1.0"
jsonwebtoken = "10.4"
dotenvy = "0.15"
uuid = { version = "1.23", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
validator = { version = "0.20.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
