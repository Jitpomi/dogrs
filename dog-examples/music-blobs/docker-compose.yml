services:
  rustfs:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: rustfs_local
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID:?set local credentials in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY:?set local credentials in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]

  music-blobs:
    build:
      context: ../../../dogrs
      dockerfile: dog-examples/music-blobs/Dockerfile
    container_name: music_blobs_app
    ports:
      - "127.0.0.1:3030:3030"
    env_file:
      - .env
    environment:
      - HTTP_HOST=0.0.0.0
      - MUSIC_ALLOW_CONTAINER_BIND=1
    depends_on:
      - rustfs
    volumes:
      - ./static:/app/static:ro
      - music_state:/app/data

volumes:
  music_state:
  rustfs_data:
    driver: local
