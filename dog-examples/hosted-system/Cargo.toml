[package]
name = "hosted-system"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
futures = "0.3"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
dog-core = { path = "../../dog-core" }
dog-schema = { path = "../../dog-schema" }
dog-transport = { path = "../../dog-transport", features = ["http"] }
dog-queue = { path = "../../dog-queue", features = ["postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-pemfile = "2"
async-nats = { version = "0.50", optional = true }
redis = { version = "1.7.1", optional = true, features = ["tokio-rustls-comp"] }
lapin = { version = "2.4", optional = true }
rdkafka = { version = "0.36", optional = true, features = ["cmake-build", "ssl"] }
rskafka = { version = "0.6", optional = true, features = ["transport-tls"] }
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

aws-sdk-sqs = { version = "1.113", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }

google-cloud-pubsub = { version = "1.5", optional = true }

[features]
queue-diagnostics = ["dog-queue/queue-diagnostics"]
redis = ["dog-queue/redis", "dep:redis"]
nats = ["dog-queue/nats", "dep:async-nats"]
rabbitmq = ["dog-queue/rabbitmq", "dep:lapin"]
kafka = ["dog-queue/kafka-rdkafka", "dep:rdkafka"]
kafka-rust = ["dog-queue/kafka-rskafka", "dep:rskafka"]

sqs = ["dog-queue/aws-sqs", "dep:aws-sdk-sqs"]
pubsub = ["dog-queue/gcp-pubsub", "dep:google-cloud-pubsub"]
