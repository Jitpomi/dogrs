[package]
name = "fleet-queue"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.52", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors", "fs"] }
async-trait = "0.1"
typedb-driver = "3.11.5"
dotenvy = "0.15"
reqwest = { version = "0.13", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
dog-transport = { path = "../../dog-transport", features = ["http"] }
axum = { version = "0.8.9", features = ["macros", "json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
dog-core = { path = "../../dog-core" }
dog-typedb = { path = "../../dog-typedb" }
dog-queue = { path = "../../dog-queue" }

[lib]
name = "fleet_queue"
path = "src/lib.rs"
