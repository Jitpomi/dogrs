name: Provider capacity
on:
  pull_request:
    paths: ['.github/workflows/provider-capacity.yml', 'dog-queue/**', 'dog-examples/hosted-system/**', 'Cargo.lock']
  workflow_dispatch:
    inputs:
      mode:
        description: Attribution profiles are diagnostics, not production acceptance
        type: choice
        options: [queue, attribution]
        default: queue
      repeats:
        description: Attribution repetitions (odd repetitions reverse profile order)
        type: choice
        options: ['1', '2', '3']
        default: '2'
      backend:
        type: choice
        options: [postgres, redis, nats]
        required: true
      payload_bytes:
        type: choice
        options: ['1024', '65536']
        required: true
      seconds:
        type: choice
        options: ['10', '30', '60']
        default: '60'
      nats_shards:
        description: Fixed JetStream bucket count
        type: choice
        options: ['1', '4', '16']
        default: '16'
      postgres_commit_delay_us:
        description: PostgreSQL durable commit grouping delay
        type: choice
        options: ['0', '1000', '3000', '5000']
        default: '0'
      profile_postgres:
        description: Sample active PostgreSQL waits during capacity measurement
        type: boolean
        default: false
      postgres_fixture_partitions:
        description: Disposable PostgreSQL layout experiment (not a library setting)
        type: choice
        options: ['0', '16', 'compare']
        default: '0'
      postgres_shards:
        description: Fixed PostgreSQL storage schemas sharing the total 64-connection budget
        type: choice
        options: ['1', '4', '16', 'compare']
        default: '1'
      workers_per_tenant:
        description: Worker concurrency (auto preserves the baseline)
        type: choice
        options: ['auto', '1', '2', '4', '8']
        default: 'auto'
      postgres_enqueue_concurrency:
        description: Producer connection cap (none preserves the baseline)
        type: choice
        options: ['none', '16', '32', '48']
        default: 'none'
permissions:
  contents: read
jobs:
  capacity:
    if: ${{ inputs.mode != 'attribution' }}
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.backend && format('["{0}"]', inputs.backend) || '["postgres","redis","nats"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p hosted-system --release --features redis,nats --locked
      - run: |
          if [ "$PRODUCER_CAP" != none ]; then
            export DOGRS_PG_ENQUEUE_CONCURRENCY="$PRODUCER_CAP"
          fi
          if [ "$PG_SHARDS" = compare ]; then
            test "$BACKEND" = postgres
            test "$DOGRS_PG_FIXTURE_PARTITIONS" = 0
            status=0
            for shards in 1 4 16 16 4 1; do
              DOGRS_CAPACITY_SHARDS="$shards" python3 dog-examples/hosted-system/run_recovery.py "$BACKEND" --capacity --seconds "$DURATION_SECONDS" --bytes "$PAYLOAD_BYTES" --report-dir provider-capacity || status=1
            done
            exit "$status"
          fi
          if [ "$DOGRS_PG_FIXTURE_PARTITIONS" = compare ]; then
            test "$BACKEND" = postgres
            status=0
            for partitions in 0 16 16 0; do
              DOGRS_PG_FIXTURE_PARTITIONS="$partitions" python3 dog-examples/hosted-system/run_recovery.py "$BACKEND" --capacity --seconds "$DURATION_SECONDS" --bytes "$PAYLOAD_BYTES" --report-dir provider-capacity || status=1
            done
            exit "$status"
          fi
          python3 dog-examples/hosted-system/run_recovery.py "$BACKEND" --capacity --seconds "$DURATION_SECONDS" --bytes "$PAYLOAD_BYTES" --report-dir provider-capacity
        env:
          BACKEND: ${{ matrix.backend }}
          DURATION_SECONDS: ${{ inputs.seconds || '60' }}
          PAYLOAD_BYTES: ${{ inputs.payload_bytes || '65536' }}
          DOGRS_SYSTEM_BINARY: target/release/hosted-system
          DOGRS_CAPACITY_WORKERS: ${{ inputs.workers_per_tenant && inputs.workers_per_tenant != 'auto' && inputs.workers_per_tenant || (matrix.backend == 'nats' && '2' || '1') }}
          PRODUCER_CAP: ${{ inputs.postgres_enqueue_concurrency || 'none' }}
          DOGRS_CAPACITY_INFLIGHT: 32
          DOGRS_PG_COMMIT_DELAY: ${{ matrix.backend == 'postgres' && (inputs.postgres_commit_delay_us || '0') || '0' }}
          DOGRS_PG_PROFILE: ${{ inputs.profile_postgres && '1' || '0' }}
          DOGRS_PG_FIXTURE_PARTITIONS: ${{ inputs.postgres_fixture_partitions || '0' }}
          PG_SHARDS: ${{ inputs.postgres_shards || '1' }}
          DOGRS_NATS_IMAGE: nats:2.15.0-alpine
          DOGRS_CAPACITY_SHARDS: ${{ matrix.backend == 'nats' && (inputs.nats_shards || '16') || (matrix.backend == 'postgres' && inputs.postgres_shards != 'compare' && inputs.postgres_shards) || '1' }}
      - name: Explain capacity result
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          logs = list(pathlib.Path("provider-capacity").glob("*/capacity.log"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Sustained queue capacity\n\n")
              found = False
              for log in logs:
                  environment = json.loads((log.parent / 'environment.json').read_text())
                  summary.write(f"\nFixture partitions: {environment.get('postgres_fixture_partitions', 0)}\n\n")
                  for line in log.read_text().splitlines():
                      try:
                          result = json.loads(line)
                      except ValueError:
                          continue
                      if not isinstance(result, dict) or "offered" not in result:
                          continue
                      found = True
                      summary.write("**" + ("Passed" if result.get("passed") is True else "Failed") + "**\n\n")
                      summary.write("| Measurement | Observed |\n|---|---:|\n")
                      for key in ("tenants", "seconds", "payload_bytes", "offered", "accepted", "completed", "verified_terminal_once", "overload", "late_offers", "error_count", "elapsed_seconds"):
                          value = result.get(key)
                          if isinstance(value, (int, float)):
                              summary.write(f"| {key} | {value} |\n")
                      summary.write("\nEvery offered job must be admitted, completed and verified once, with no dropped or late offers, no operation errors, and at most five seconds to drain. Zero operation errors alone is not a pass.\n\n")
              if not found:
                  summary.write("The capacity measurement did not finish or was not started. Inspect the failed build/setup step and attached logs; this is not a capacity pass.\n")
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-capacity-${{ matrix.backend }}
          path: provider-capacity

  attribution:
    if: ${{ inputs.mode == 'attribution' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p hosted-system --release --features redis,nats --locked
      - name: Compare serial fresh-server profiles
        run: python3 dog-examples/hosted-system/compare_capacity.py --report-dir provider-attribution --seconds "$SECONDS_PER_RUN" --payloads "$PAYLOAD_BYTES" --backends "$BACKEND" --repeats "$REPEATS"
        env:
          DOGRS_SYSTEM_BINARY: target/release/hosted-system
          SECONDS_PER_RUN: ${{ inputs.seconds }}
          PAYLOAD_BYTES: ${{ inputs.payload_bytes }}
          BACKEND: ${{ inputs.backend }}
          REPEATS: ${{ inputs.repeats }}
      - name: Explain comparison scope
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          report = pathlib.Path('provider-attribution/comparison.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Provider attribution diagnostics\n\nThese measurements do not certify production readiness or excuse failed queue acceptance.\n\n')
              if report.exists():
                  data = json.loads(report.read_text())
                  summary.write('| Repeat | Mode | Accepted | Completed | Target met |\n|---|---|---:|---:|---|\n')
                  for row in data['runs']:
                      result = row.get('result') or {}
                      summary.write(f"| {row['repeat']} | {row['mode']} | {result.get('accepted', 'missing')} | {result.get('completed', 'not measured')} | {result.get('passed', result.get('admission_target_met', False))} |\n")
                  summary.write('\n' + '\n'.join('- ' + note for note in data['notes']) + '\n')
              else:
                  summary.write('No comparison report was produced; inspect build/setup logs.\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-attribution-${{ inputs.backend }}
          path: provider-attribution
