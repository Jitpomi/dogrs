name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Check diagnostic result classification
        run: python3 -m unittest discover -s dog-examples/hosted-system -p 'test_diagnostic_result.py'
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  transports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check realtime example protocols
        run: |
          node --check dog-examples/iot-devices/static/app.js
          node --check dog-examples/fleet-queue/static/app.js
          node dog-transport/tests/realtime_clients.cjs
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          for features in '' http grpc cli iroh http,grpc,cli,iroh; do
            cargo check -p dog-transport --no-default-features --features "$features" --locked
          done
      - run: cargo test -p dog-transport --features http,grpc,cli,iroh --all-targets --locked
      - run: cargo test -p dog-core --no-default-features --locked
      - run: cargo test -p dog-core --no-default-features --features serde --locked
      - run: cargo test -p dog-auth -p dog-auth-local -p dog-auth-oauth --features dog-auth-oauth/oauth2-client --all-targets --locked
      - run: cargo test -p dog-auth --no-default-features --features jwt-aws-lc-rs --locked
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dogrs-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: docker run -d --name typedb-ci -p 127.0.0.1:1729:1729 typedb/typedb:3.13.6
      - run: cargo test -p dog-queue --features redis,postgres,cron-scheduling --locked
      - run: docker run -d --name nats-ci -p 127.0.0.1:4222:4222 nats:2.11-alpine -js -sd /data
      - run: cargo test -p dog-queue --features redis,postgres,nats --test durable_backends --locked -- --ignored
        env:
          DOGRS_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=dogrs-test-only
          DOGRS_REDIS_URL: redis://127.0.0.1:6379
          DOGRS_NATS_URL: nats://127.0.0.1:4222
      - run: cargo test -p dog-queue --features redis,postgres,nats --test kv_records --locked -- --ignored
        env:
          DOGRS_REDIS_URL: redis://127.0.0.1:6379
          DOGRS_NATS_URL: nats://127.0.0.1:4222
      - run: cargo test -p dog-queue --features nats --lib --locked claim_read_tests
      - run: cargo test -p dog-queue --features nats --lib --locked -- --ignored --skip nats_batch
        env:
          DOGRS_NATS_URL: nats://127.0.0.1:4222
      - run: docker run -d --name nats-atomic-ci -p 127.0.0.1:4223:4222 nats:2.15.0-alpine -js -sd /data
      - run: cargo test -p dog-queue --features nats --lib --locked nats_batch -- --include-ignored
        env:
          DOGRS_NATS_URL: nats://127.0.0.1:4223
      - run: cargo test -p dog-queue --features postgres --test postgres_rows --locked -- --ignored
        env:
          DOGRS_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=dogrs-test-only
      - run: cargo test -p dog-queue --features postgres --test production_faults postgres_recovers_after_partition_and_fences_expired_owner --locked -- --ignored
        env:
          DOGRS_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=dogrs-test-only
      - run: |
          for attempt in $(seq 1 30); do
            if docker logs typedb-ci 2>&1 | grep -q 'Ready!'; then break; fi
            sleep 2
          done
          cargo test -p dog-typedb --test live_database --locked -- --ignored
        env:
          TYPEDB_ADDRESS: 127.0.0.1:1729
      - if: always()
        run: docker logs typedb-ci
  optional-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake libsasl2-dev libssl-dev libcurl4-openssl-dev pkg-config
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: |
          for features in postgres redis nats-async amqp rabbitmq-lapin kafka-rdkafka kafka-rskafka aws-sqs gcp-pubsub; do
            cargo check -p dog-queue --no-default-features --features "$features" --locked
          done

  brokers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [rabbitmq, aws-sqs, kafka, gcp-pubsub]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dogrs-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DOGRS_POSTGRES_URL: host=127.0.0.1 port=5432 user=postgres password=dogrs-test-only
      DOGRS_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/%2f
      DOGRS_SQS_URL: http://127.0.0.1:9324
      DOGRS_KAFKA_BROKERS: 127.0.0.1:9092
      DOGRS_KAFKA_TOPIC: dogrs-ci
      DOGRS_PUBSUB_ENDPOINT: http://127.0.0.1:8085
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.backend == 'rabbitmq'
        run: docker run -d --name rabbit-ci -p 127.0.0.1:5672:5672 rabbitmq:4.1-alpine
      - if: matrix.backend == 'aws-sqs'
        run: docker run -d --name sqs-ci -p 127.0.0.1:9324:9324 softwaremill/elasticmq-native:1.6.15
      - if: matrix.backend == 'kafka'
        run: sudo apt-get update && sudo apt-get install -y cmake libsasl2-dev libssl-dev libcurl4-openssl-dev pkg-config
      - if: matrix.backend == 'kafka'
        run: |
          docker run -d --name kafka-ci -p 127.0.0.1:9092:9092 redpandadata/redpanda:v25.1.9 redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr 127.0.0.1:9092
          for attempt in $(seq 1 30); do
            if docker exec kafka-ci rpk topic create dogrs-ci --brokers 127.0.0.1:9092; then break; fi
            sleep 2
          done
      - if: matrix.backend == 'gcp-pubsub'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.backend == 'gcp-pubsub'
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: 563.0.0
          install_components: pubsub-emulator,beta
      - if: matrix.backend == 'gcp-pubsub'
        run: |
          mkdir -p /tmp/dogrs-pubsub
          nohup gcloud beta emulators pubsub start --host-port=127.0.0.1:8085 --project=dogrs-test --data-dir=/tmp/dogrs-pubsub --quiet > /tmp/pubsub.log 2>&1 < /dev/null &
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8085; then break; fi
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:8085 || { cat /tmp/pubsub.log; exit 1; }
      - run: cargo test -p dog-queue --features postgres,${{ matrix.backend }} --test broker_backends --locked -- --ignored
      - if: always() && matrix.backend == 'gcp-pubsub'
        run: cat /tmp/pubsub.log

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  provider-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p hosted-system --release --features redis,nats --locked
      - run: |
          for backend in postgres redis nats; do
            python3 dog-examples/hosted-system/run_recovery.py "$backend" --report-dir provider-recovery
          done
          python3 dog-examples/hosted-system/verify_capacity_deadline.py --report-dir provider-recovery
          python3 dog-examples/hosted-system/run_recovery.py redis --restore --outage-seconds 300 --report-dir provider-recovery
        env:
          DOGRS_SYSTEM_BINARY: target/release/hosted-system
      - name: Collect recovery evidence without database files
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          for folder in Path('provider-recovery').glob('dogrs-fault-*'):
              for source in folder.iterdir():
                  if source.suffix in {'.log', '.json', '.conf'} and source.is_file():
                      destination = Path('provider-recovery-logs') / folder.name / source.name
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, destination)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-recovery
          path: provider-recovery-logs
