[package]
name = "dog-transport"
version = "0.2.0"
edition = "2021"
description = "HTTP, gRPC, CLI and Iroh transports for DogRS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jitpomi/dogrs"
documentation = "https://docs.rs/dog-transport"
readme = "README.md"

[dependencies]
dog-core = { path = "../dog-core", version = "0.2.0", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"

tonic = { version = "0.14", optional = true, features = ["transport"] }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
tonic-reflection = { version = "0.14", optional = true }

# HTTP optional dependencies
http = { version = "1", optional = true }
tower = { version = "0.5", optional = true }
http-body-util = { version = "0.1", optional = true }
http-body = { version = "1.0", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
iroh = { version = "1.0.0", optional = true }
iroh-blobs = { version = "0.103.0", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

[features]
default = []
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tonic-reflection", "dep:tonic-prost-build", "dep:protoc-bin-vendored", "dep:tokio"]
cli = ["dep:tokio"]
http = [
    "dep:http",
    "dep:tower",
    "dep:http-body-util",
    "dep:http-body",
    "dep:serde_urlencoded",
    "dep:anyhow",
    "dep:async-trait",
    "dep:bytes",
    "dep:uuid",
    "dep:futures-util",
    "dep:tokio"
]
iroh = [
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:anyhow",
    "dep:async-trait",
    "dep:tokio",
    "dep:futures"
]

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.29"
reqwest = { version = "0.12", default-features = false }
dog-auth = { path = "../dog-auth", version = "0.2.0" }
async-trait = "0.1"
anyhow = "1"
tokio-stream = { version = "0.1", features = ["net"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
