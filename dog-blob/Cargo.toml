[package]
name = "dog-blob"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
authors = ["Jitpomi <hello@jitpomi.com>"]
description = "Tenant-scoped blob storage with bounded uploads and resumable multipart coordination"
documentation = "https://docs.rs/dog-blob"
repository = "https://github.com/Jitpomi/dogrs"
license = "MIT OR Apache-2.0"
keywords = ["blob", "storage", "streaming", "s3", "media"]
categories = ["web-programming", "multimedia", "filesystem"]
readme = "README.md"

[package.metadata]

[package.metadata.ferrisup]
component_type = "library"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-core = "0.3.32"
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["sync", "fs", "io-util", "time", "rt"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }

# AWS SDK dependencies for S3-compatible storage
aws-config = { version = "1.8", optional = true }
aws-credential-types = { version = "1.2", optional = true }
aws-sdk-s3 = { optional = true, version = "1.150", default-features = false, features = ["default-https-client", "rt-tokio", "http-1x", "sigv4a"] }
futures = "0.3"
tempfile = "3"
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.10"

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sdk-s3"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }
tokio-test = "0.4.5"

[lib]
name = "dog_blob"
path = "src/lib.rs"
