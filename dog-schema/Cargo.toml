[package]
name = "dog-schema"
version = "0.2.0"
edition = "2021"
authors = ["Jitpomi <hello@jitpomi.com>"]
description = "Validation and normalization hooks with structured errors for DogRS services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jitpomi/dogrs"
documentation = "https://docs.rs/dog-schema"
keywords = ["schema", "validation", "json", "types"]
categories = ["data-structures", "development-tools"]
readme = "README.md"

[dependencies]
dog-core = { path = "../dog-core", version = "0.2.0", features = ["json"] }
serde_json = "1"
anyhow = "1"

# Re-export proc macros
dog-schema-macros = { path = "../dog-schema-macros", version = "0.2.0" }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
