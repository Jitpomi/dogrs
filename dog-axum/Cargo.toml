[package]
name = "dog-axum"
version = "0.3.0"
edition = "2021"
authors = ["Jitpomi <hello@jitpomi.com>"]
description = "Deprecated Axum compatibility wrapper; use dog-transport with its http feature"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jitpomi/dogrs"
documentation = "https://docs.rs/dog-axum"
keywords = ["axum", "web", "http", "framework"]
categories = ["web-programming", "asynchronous"]
readme = "README.md"

[badges]
maintenance = { status = "deprecated" }

[package.metadata]

[package.metadata.ferrisup]
component_type = "library"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dog-transport = { path = "../dog-transport", version = "0.3.0", features = ["http"] }
serde_urlencoded = "0.7"
axum = { version = "0.8.9", features = ["macros", "json", "multipart"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
tower = "0.5.3"
base64 = "0.22"
anyhow = "1.0.102"
async-trait = "0.1.89"
tracing = "0.1.44"
tower-http = { version = "0.6.11", features = ["trace", "request-id"] }
uuid = { version = "1.23.2", features = ["v4"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
dog-core = { path = "../dog-core", version = "0.3.0", features = ["json"] }
dog-auth = { path = "../dog-auth", version = "0.3.0", optional = true }
multer = "3.1.0"
tempfile = "3"

[features]
default = []
auth = ["dep:dog-auth"]

[dev-dependencies]
anyhow = "1.0.102"
tower = "0.5.3"
http-body-util = "0.1.3"

[lib]
name = "dog_axum"
path = "src/lib.rs"
