[package]
name = "dog-auth"
version = "0.2.0"
edition = "2021"
description = "Authentication system for DogRS framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jitpomi/dogrs"
documentation = "https://docs.rs/dog-auth"
readme = "README.md"
keywords = ["authentication", "jwt", "dogrs", "framework"]
categories = ["authentication", "web-programming"]

[features]
default = ["jwt-aws-lc-rs", "jwt-pem"]
jwt-pem = ["jsonwebtoken?/use_pem"]

# AWS-LC supplies the production JWT implementation.
jwt-aws-lc-rs = ["dep:jsonwebtoken", "jsonwebtoken/aws_lc_rs"]

# Optional PEM decoding support (enabled by default in jsonwebtoken)
jwt-no-pem = []

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bcrypt = "0.19.1"
chrono = { version = "0.4", features = ["serde"] }
dog-core = { path = "../dog-core", version = "0.2.0" }
humantime-serde = "1.1"
# jsonwebtoken with configurable crypto backend via features
jsonwebtoken = { version = "10.4.0", optional = true, default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
uuid = { version = "1.23", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
