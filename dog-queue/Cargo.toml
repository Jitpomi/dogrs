[package]
name = "dog-queue"
version = "0.2.0"
edition = "2021"
authors = ["DogRS Team"]
description = "Tenant-scoped jobs with durable ledgers, lease-based processing, and broker integrations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jitpomi/dogrs"
homepage = "https://dogrs.dev"
documentation = "https://docs.rs/dog-queue"
keywords = ["queue", "jobs", "async", "multi-tenant", "background"]
categories = ["asynchronous", "concurrency", "database"]
readme = "README.md"

[package.metadata]

[package.metadata.ferrisup]
component_type = "library"

# Core dependencies for revolutionary architecture
[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }
tracing = "0.1.44"
parking_lot = "0.12.5"
rand = "0.10.1"
futures = "0.3.32"
futures-core = "0.3.32"
tokio-stream = { version = "0.1.18", features = ["sync"] }
serde_json = "1.0.150"
dashmap = "6.2.1"
opentelemetry = { version = "0.32.0", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, features = ["env-filter", "json"] }

# Zero-copy and performance optimizations
bytes = { version = "1.11.1", optional = true }
smallvec = { version = "1.15.1", optional = true }
tinyvec = { version = "1.11.0", features = ["alloc"], optional = true }

# Workflow and scheduling
cron = { version = "0.16.0", optional = true }

# Storage backends (optional)
bb8 = { version = "0.9.1", optional = true }
redis = { version = "1.7.1", optional = true, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager"] }
tokio-postgres = { version = "0.7.17", optional = true, features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
sha2 = { version = "0.10", optional = true }
rmp-serde = { version = "1.3", optional = true }
bincode = { version = "1.3", optional = true }
lapin = { version = "2.4.0", optional = true }
rdkafka = { version = "0.36", optional = true, features = ["cmake-build"] }
rskafka = { version = "0.6.0", optional = true }
aws-sdk-sqs = { version = "1.113", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
google-cloud-pubsub = { version = "1.5", optional = true }
async-nats = { version = "0.50", optional = true }

# Observability (optional)
prometheus = { version = "0.14.0", optional = true }
tracing-opentelemetry = { version = "0.29.0", optional = true }

# Web UI (optional)
axum = { version = "0.8.9", optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.6.11", optional = true, features = ["cors", "fs"] }
# Legacy compatibility

[dev-dependencies]
google-cloud-auth = "1.17"
tokio = { version = "1.52.3", features = ["full"] }
tokio-test = "0.4.5"
tracing-test = "0.2.6"
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"
test-log = "0.2.21"

# Feature flags for modular functionality
[features]
default = ["memory", "json"]

# Core features
memory = []
json = []

# Storage backends
redis = ["dep:redis"]
postgres = ["dep:tokio-postgres", "dep:bb8"]
amqp = ["rabbitmq-lapin"]
kafka-rdkafka = ["dep:rdkafka"]
kafka-rskafka = ["dep:rskafka"]
kafka = ["kafka-rdkafka", "kafka-rskafka"]
aws-sqs = ["dep:aws-sdk-sqs"]
gcp-pubsub = ["dep:google-cloud-pubsub"]
nats-async = ["dep:async-nats", "dep:sha2", "dep:bytes"]
nats = ["nats-async"]
rabbitmq-lapin = ["dep:lapin"]


# Scheduling
cron-scheduling = ["dep:cron"]


# Observability
tracing-basic = ["dep:tracing-subscriber"]
tracing-opentelemetry = ["dep:opentelemetry", "dep:tracing-opentelemetry"]
queue-diagnostics = []
metrics = ["dep:prometheus"]

ui = ["dep:axum", "dep:tower", "dep:tower-http"]

# Performance optimizations
zero-copy = ["dep:bytes", "dep:smallvec"]
adaptive = []

# Full feature set
rabbitmq = ["rabbitmq-lapin"]



[lib]
name = "dog_queue"
path = "src/lib.rs"
