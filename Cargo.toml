[workspace]
members = [
    "dog-examples/transport-demo",
    "dog-examples/hosted-system",
    "dog-core",
    "dog-transport",
    "dog-axum",
    "dog-typedb",
    "dog-blob",
    "dog-queue",
    "dog-schema",
    "dog-schema-macros",
    "dog-schema-validator",
    "dog-examples/music-blobs",
    "dog-examples/blog",
    "dog-examples/social-typedb",
    "dog-examples/fleet-queue",
    "dog-examples/auth-demo",
    "dog-examples/iot-devices",
    "dog-examples/calendar",
    "dog-auth",
    "dog-auth-local",
    "dog-auth-oauth"
]

exclude = ["tests/aws-signing"]

resolver = "2"

# Reviewed upstream compatibility branches; see docs/dependency-security.md.
[patch.crates-io]
typedb-driver = { git = "https://github.com/Jitpomi/typedb-driver", rev = "548a885bc3dee18a3a84fb3092e8b45dc9a4e081" }
postcard = { git = "https://github.com/Jitpomi/postcard", rev = "d3df0e18bc00553b05238dd7062544c5feb63efd" }
netlink-packet-core = { git = "https://github.com/Jitpomi/netlink-packet-core", rev = "8d50a3e68354700aaedc3c69b143b57329969c70" }
bao-tree = { git = "https://github.com/n0-computer/bao-tree", rev = "d50f2b2ce4b2477f9c7bfa3c452914b9bc66b334" }
