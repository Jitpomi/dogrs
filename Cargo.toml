[workspace]
members = [
    "dog-examples/transport-demo",
    "dog-examples/hosted-system",
    "dog-core",
    "dog-transport",
    "dog-axum",
    "dog-typedb",
    "dog-blob",
    "dog-queue",
    "dog-schema",
    "dog-schema-macros",
    "dog-schema-validator",
    "dog-examples/music-blobs",
    "dog-examples/blog",
    "dog-examples/social-typedb",
    "dog-examples/fleet-queue",
    "dog-examples/auth-demo",
    "dog-examples/iot-devices",
    "dog-auth",
    "dog-auth-local",
    "dog-auth-oauth"
]

exclude = ["vendor/aws-sigv4"]

resolver = "2"

# Temporary security fix; see vendor/aws-sigv4/DOGRS-PATCH.md.
[patch.crates-io]
aws-sigv4 = { path = "vendor/aws-sigv4" }
